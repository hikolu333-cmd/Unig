; DIY RF Kit — ESP32-S3-N16R8 devkit + 2.8" ILI9341 SPI TFT (touch) + KY-023
; joystick + CC1101 + NRF24L01 + KY-005 IR. Out-of-tree board (not in
; default_envs) — same status as diy_joystick/diy_marauder.
; Build/flash explicitly: pio run -e diy_rf_n16r8 -t upload
[env:diy_rf_n16r8]
board = diy_rf_n16r8
board_build.partitions = firmware/partitions_16mb.csv
board_build.arduino.memory_type = qio_qspi
build_src_filter = ${env.build_src_filter} +<../boards/diy_rf_n16r8>
build_flags =
	${env.build_flags}
	-Ifirmware/boards/diy_rf_n16r8

lib_deps =
	${env.lib_deps}
