; DIY Joystick — bare ESP32-S3 devkit + 2.8" ILI9341 SPI TFT + KY-023 joystick.
; Out-of-tree board (not in default_envs) — same status as diy_marauder.
; Build/flash explicitly: pio run -e diy_joystick -t upload
[env:diy_joystick]
board = diy_joystick
board_build.partitions = firmware/partitions_16mb.csv
board_build.arduino.memory_type = qio_opi   ; N16R8: octal PSRAM + QIO flash (quad probe of the octal chip hangs the boot)
build_src_filter = ${env.build_src_filter} +<../boards/diy_joystick> -<hello.cpp>
build_flags =
	${env.build_flags}
	-Ifirmware/boards/diy_joystick
	; WifiAttackUtil.cpp overrides ieee80211_raw_frame_sanity_check (raw-frame
	; trick), which collides with libnet80211.a on this repackaged framework.
	; First definition in link order (our .o) wins, so the override still works.
	-Wl,--allow-multiple-definition
	; RadioKeeper: weak-rail insurance — count mid-start brownouts, refuse
	; after 5 (config.ini wraps esp_wifi_start + register_chipv7_phy only;
	; radio is strictly on-demand, init/stop/deinit pass through).
	-Wl,--wrap=esp_wifi_start
	-Wl,--wrap=register_chipv7_phy
	; LVGL shell (new home + menu). Config lives in firmware/src/lv_conf.h.
	-DUSE_LVGL_SHELL
	-DLV_CONF_INCLUDE_SIMPLE
	-Ifirmware/src

lib_deps =
	${env.lib_deps}
	lvgl/lvgl@^8.3.11

[env:diy_joystick_remote]
board = diy_joystick
board_build.partitions = firmware/partitions_16mb.csv
board_build.arduino.memory_type = qio_opi   ; N16R8: octal PSRAM + QIO flash (quad probe of the octal chip hangs the boot)
build_src_filter = ${env.build_src_filter} +<../boards/diy_joystick> -<hello.cpp>
build_flags =
	${env.build_flags}
	-Ifirmware/boards/diy_joystick
	; WifiAttackUtil.cpp overrides ieee80211_raw_frame_sanity_check (raw-frame
	; trick), which collides with libnet80211.a on this repackaged framework.
	; First definition in link order (our .o) wins, so the override still works.
	-Wl,--allow-multiple-definition
	; RadioKeeper: weak-rail insurance — count mid-start brownouts, refuse
	; after 5 (config.ini wraps esp_wifi_start + register_chipv7_phy only;
	; radio is strictly on-demand, init/stop/deinit pass through).
	-Wl,--wrap=esp_wifi_start
	-Wl,--wrap=register_chipv7_phy
	; LVGL shell (new home + menu). Config lives in firmware/src/lv_conf.h.
	-DUSE_LVGL_SHELL
	-DLV_CONF_INCLUDE_SIMPLE
	-Ifirmware/src
	; Auto-start USB Remote (mirror + remote input) at boot.
	-DUSB_REMOTE_AUTOSTART
	; setup() chain (Uni.begin → TFT init → splash → LVGL shell) overflows the
	; default 8 KB loopTask stack — TFT_eSPI::init crash in the old coredump.
	-DARDUINO_LOOP_STACK_SIZE=24576

lib_deps =
	${env.lib_deps}
	lvgl/lvgl@^8.3.11

