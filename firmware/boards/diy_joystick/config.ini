; DIY Joystick — bare ESP32-S3 devkit + 2.8" ILI9341 SPI TFT + KY-023 joystick.
; Out-of-tree board (not in default_envs) — same status as diy_marauder.
; Build/flash explicitly: pio run -e diy_joystick -t upload
[env:diy_joystick]
board = diy_joystick
board_build.partitions = firmware/partitions_16mb.csv
board_build.arduino.memory_type = qio_qspi
build_src_filter = ${env.build_src_filter} +<../boards/diy_joystick>
build_flags =
	${env.build_flags}
	-Ifirmware/boards/diy_joystick
	; WifiAttackUtil.cpp overrides ieee80211_raw_frame_sanity_check (raw-frame
	; trick), which collides with libnet80211.a on this repackaged framework.
	; First definition in link order (our .o) wins, so the override still works.
	-Wl,--allow-multiple-definition

lib_deps =
	${env.lib_deps}
