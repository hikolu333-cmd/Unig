<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключено</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#141e30,#243b55);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.ok{background:#fff;max-width:340px;width:90%;padding:36px 26px;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45);text-align:center}
.circle{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#00c6ff,#0072ff);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 22px rgba(0,114,255,.4)}
.circle svg{width:34px;height:34px}
h2{font-size:19px;color:#1c2733;margin-bottom:8px}
p{color:#78849a;font-size:13px;line-height:1.6}
.speed{display:flex;justify-content:center;gap:24px;margin-top:20px;padding-top:18px;border-top:1px solid #eef1f6}
.speed div b{display:block;font-size:15px;color:#0072ff}
.speed div span{font-size:11px;color:#a4adbd}
</style>
</head>
<body>
<div class="ok">
  <div class="circle">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>
  <h2>Вы в сети!</h2>
  <p>Устройство успешно подключено<br>к бесплатному Wi-Fi</p>
  <div class="speed">
    <div><b>100</b><span>Мбит/с</span></div>
    <div><b>0 ₽</b><span>стоимость</span></div>
    <div><b>∞</b><span>трафик</span></div>
  </div>
</div>
</body>
</html>
