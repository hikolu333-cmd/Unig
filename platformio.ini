; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include
build_dir = firmware/.pio
libdeps_dir = firmware/.pio/libdeps
default_envs = 
	m5stickcplus_11
	m5stickcplus_2
	t_lora_pager
	m5_cardputer
	m5_cardputer_adv
	t_display
	t_display_s3
	t_display_s3_touch
	diy_smoochie
	t_embed_cc1101
	reaper
	m5_cores3
	m5sticks3
	cyd_2432w328r
	cyd_2432s028
	cyd_2432s028_2usb
	cyd_2432w328c
	cyd_2432w328c_2
	cyd_3248s035r
	cyd_3248s035c
boards_dir = firmware/boards/_devices
extra_configs = 
	firmware/boards/*.ini
	firmware/boards/*/*.ini

[env]
platform = espressif32@6.13.0
framework = arduino
board_build.variants_dir = firmware/boards
board_build.filesystem = littlefs
build_flags = 
	-DHAS_NET_TOOLS
upload_speed = 1500000
monitor_speed = 115200
lib_deps = 
	Bodmer/TFT_eSPI@^2.5.43
	Bodmer/TJpg_Decoder@^1.1.0
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	h2zero/NimBLE-Arduino@^1.4.2
	https://github.com/kkloesener/MFRC522_I2C
	mikalhart/TinyGPSPlus@^1.1.0
	https://github.com/bmorcelli/IRremoteESP8266
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	nrf24/RF24@^1.4.11
	adafruit/Adafruit BusIO
	LibSSH-ESP32
extra_scripts = 
	pre:scripts/patch.py
	pre:scripts/patch_st25r3916.py
	post:scripts/merge.py

[env:t_lora_pager]
board = t_lora_pager
board_build.arduino.memory_type = qio_qspi
board_build.partitions = firmware/partitions_16mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/t_lora_pager>
build_flags = 
	${env.build_flags}
	-Ifirmware/boards/t_lora_pager
	-O2
	-DMIC_SPM1423
	-DCGRAM_OFFSET
	-DCORE_DEBUG_LEVEL=1
	-DCONFIG_SPIRAM_SUPPORT=1
lib_deps = 
	${env.lib_deps}
	adafruit/Adafruit TCA8418@^1.0.0
	mathertel/RotaryEncoder@^1.5.3

[env:diy_joystick]
board = diy_joystick
board_build.partitions = firmware/partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = ${env.build_src_filter} +<../boards/diy_joystick> -<hello.cpp>
build_flags = 
	${env.build_flags}
	-Ifirmware/boards/diy_joystick
	-Wl,--allow-multiple-definition
	-Wl,--wrap=esp_wifi_start
	-Wl,--wrap=register_chipv7_phy
	-DUSE_LVGL_SHELL
	-DLV_CONF_INCLUDE_SIMPLE
	-Ifirmware/src
lib_deps = 
	${env.lib_deps}
	lvgl/lvgl@^8.3.11

[env:diy_joystick_hello]
board = diy_joystick
board_build.partitions = firmware/partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
	-Ifirmware/boards/diy_joystick
build_src_filter = +<hello.cpp>

[env:diy_joystick_remote]
board = diy_joystick
board_build.partitions = firmware/partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
build_src_filter = ${env.build_src_filter} +<../boards/diy_joystick> -<hello.cpp>
build_flags = 
	${env.build_flags}
	-Ifirmware/boards/diy_joystick
	-Wl,--allow-multiple-definition
	-Wl,--wrap=esp_wifi_start
	-Wl,--wrap=register_chipv7_phy
	-DUSE_LVGL_SHELL
	-DLV_CONF_INCLUDE_SIMPLE
	-Ifirmware/src
	-DUSB_REMOTE_AUTOSTART
	-DARDUINO_LOOP_STACK_SIZE=24576
	-DGAME_TFT_CANVAS
lib_deps = 
	${env.lib_deps}
	lvgl/lvgl@^8.3.11

[env:diy_marauder]
board = diy_marauder
board_build.partitions = firmware/partitions_4mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/diy_marauder> -<screens/game> -<screens/ble/chameleon> -<screens/LuaScreen.cpp> -<utils/interpreter>
build_flags = 
	${env.build_flags}
	-Ifirmware/boards/diy_marauder
lib_deps = 
	${env.lib_deps}

